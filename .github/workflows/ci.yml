name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma validate
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/db
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        # no-explicit-any is tracked as a warning until the legacy `as any` route casts are removed
        run: npx eslint . --rule "@typescript-eslint/no-explicit-any: warn"
